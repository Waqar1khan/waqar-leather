<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Laptop Bags - WL Leather</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
background:#f5f5f5;
color:#222;
}

/* TOP BAR */

.topbar{
background:#111;
padding:20px;
}

.home-btn{
display:inline-block;
padding:12px 24px;
background:#25D366;
color:white;
text-decoration:none;
border-radius:8px;
font-weight:600;
transition:.3s;
}

.home-btn:hover{
background:#1ebc57;
transform:translateY(-2px);
}

/* HEADER */

header{
text-align:center;
padding:50px 20px;
background:white;
}

header h1{
font-size:42px;
margin-bottom:10px;
}

header p{
font-size:18px;
color:#666;
}

/* GALLERY */

.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:30px;
padding:50px 20px;
max-width:1300px;
margin:auto;
}

/* CARD */

.card{
background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 8px 20px rgba(0,0,0,.12);
transition:.3s;
}

.card:hover{
transform:translateY(-8px);
}

.card-img-wrap{
position:relative;
overflow:hidden;
}

.card img{
width:100%;
height:350px;
object-fit:cover;
display:block;
transition:.4s;
}

.card:hover img{
transform:scale(1.05);
}

.card-overlay{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.5);

display:flex;
justify-content:center;
align-items:center;

opacity:0;
transition:.3s;
}

.card:hover .card-overlay{
opacity:1;
}

.card-overlay a{
background:white;
color:#111;
padding:12px 20px;
border-radius:6px;
text-decoration:none;
font-weight:600;
}

.card-body{
padding:22px;
text-align:center;
}

.card-body h3{
margin-bottom:10px;
font-size:22px;
}

.card-body p{
color:#666;
}

/* FOOTER */

footer{
background:#000;
color:#aaa;
text-align:center;
padding:20px;
font-size:14px;
margin-top:30px;
}

/* MOBILE */

@media(max-width:768px){

header h1{
font-size:34px;
}

}

</style>

</head>

<body>

<!-- TOPBAR -->

<div class="topbar">

<a href="index.html" class="home-btn">
← Home
</a>

</div>

<!-- HEADER -->

<header>

<h1>Laptop Bags</h1>

<p>Premium Genuine Leather Laptop Collection</p>

</header>

<!-- GALLERY -->

<div class="gallery">

<!-- BAG 1 -->

<div class="card">

<div class="card-img-wrap">

<a href="BAG 1.jpeg" target="_blank">
<img src="BAG 1.jpeg" alt="Executive Laptop Bag">
</a>

<div class="card-overlay">
<a href="BAG 1.jpeg" target="_blank">
View Full →
</a>
</div>

</div>

<div class="card-body">

<h3>Executive Laptop Bag</h3>

<p>Premium Genuine Leather</p>

</div>

</div>

<!-- BAG 2 -->

<div class="card">

<div class="card-img-wrap">

<a href="Bag 2.jpeg" target="_blank">
<img src="Bag 2.jpeg" alt="Business Leather Bag">
</a>

<div class="card-overlay">
<a href="Bag 2.jpeg" target="_blank">
View Full →
</a>
</div>

</div>

<div class="card-body">

<h3>Business Leather Bag</h3>

<p>Luxury Office Collection</p>

</div>

</div>

<!-- BAG 3 -->

<div class="card">

<div class="card-img-wrap">

<a href="Bag 3.jpeg" target="_blank">
<img src="Bag 3.jpeg" alt="Classic Laptop Bag">
</a>

<div class="card-overlay">
<a href="Bag 3.jpeg" target="_blank">
View Full →
</a>
</div>

</div>

<div class="card-body">

<h3>Classic Laptop Bag</h3>

<p>Professional Leather Collection</p>

</div>

</div>

</div>

<!-- FOOTER -->

<footer>

© 2025 WL Leather | All Rights Reserved

</footer>

</body>
</html>
